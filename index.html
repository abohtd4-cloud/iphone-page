
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100817">
<title>Something Special</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:'Cairo',sans-serif;
  color:#fff;
  background:
    radial-gradient(ellipse at 50% 20%,#482044 0%,transparent 55%),
    radial-gradient(ellipse at 50% 90%,#260e25 0%,transparent 55%),
    #100817;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}
.container{
  width:100%;
  max-width:440px;
}
h1{
  font-size:27px;
  margin:0 0 12px;
  font-weight:800;
}
.subtitle{
  font-size:15px;
  color:#d8c5d8;
  margin-bottom:24px;
}
.preview{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:20px;
  border:1px solid #75436e;
  background:#1b1020;
  box-shadow:0 0 35px #a42c7950;
}
.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(25px) brightness(.32);
  transform:scale(1.12);
}
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  background:#160c1b35;
}
.play{
  width:76px;
  height:76px;
  border-radius:50%;
  background:#c52b85;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 28px #d42c9a80;
}
.play:after{
  content:"";
  width:0;height:0;
  border-top:14px solid transparent;
  border-bottom:14px solid transparent;
  border-left:21px solid white;
  margin-left:6px;
}
.caption{
  font-size:19px;
  font-weight:800;
  text-shadow:0 2px 8px #000;
}
.status{
  margin:20px 0;
  color:#e3c8df;
  font-size:14px;
}
.progress{
  height:6px;
  background:#38243a;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}
.bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#9b2caa,#f04d9c);
  transition:width 1s linear;
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-family:inherit;
  font-size:18px;
  font-weight:800;
  color:white;
  background:linear-gradient(135deg,#a52a91,#e23b87);
  cursor:pointer;
  box-shadow:0 8px 25px #b62c8650;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
a{
  text-decoration:none;
  color:inherit;
}
.note{
  margin-top:16px;
  color:#a995aa;
  font-size:12px;
}
[dir="rtl"]{direction:rtl}
</style>
</head>

<body>
<div class="container">

  <h1 id="title">Something Special</h1>
  <div class="subtitle" id="subtitle">Your content is almost ready</div>

  <a id="playLink" href="#" target="_blank" rel="noopener">
    <div class="preview">
      <img id="previewImage" src="./IMG_6092.gif" alt="Preview">
      <div class="overlay">
        <div class="play"></div>
        <div class="caption" id="caption">Watch Now</div>
      </div>
    </div>
  </a>

  <div class="status" id="status">Preparing your content...</div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div style="margin-top:22px">
    <a id="continueLink" href="#" target="_blank" rel="noopener">
      <button id="continueBtn" disabled>Continue</button>
    </a>
  </div>

  <div class="note" id="note">Please wait a moment</div>
</div>

<script>
const smartLink =
"https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7";

const translations = {
  en:{
    title:"Something Special",
    subtitle:"Your content is almost ready",
    caption:"Watch Now",
    status:"Preparing your content...",
    ready:"Your content is ready!",
    button:"Continue",
    note:"Please wait a moment"
  },
  sw:{
    title:"Kitu Maalum",
    subtitle:"Maudhui yako yanakaribia kuwa tayari",
    caption:"Tazama Sasa",
    status:"Tunatayarisha maudhui yako...",
    ready:"Maudhui yako yako tayari!",
    button:"Endelea",
    note:"Tafadhali subiri kidogo"
  },
  pt:{
    title:"Algo Especial",
    subtitle:"O seu conteúdo está quase pronto",
    caption:"Assistir Agora",
    status:"A preparar o seu conteúdo...",
    ready:"O seu conteúdo está pronto!",
    button:"Continuar",
    note:"Por favor, aguarde um momento"
  },
  fil:{
    title:"May Espesyal Para Sa Iyo",
    subtitle:"Halos handa na ang iyong content",
    caption:"Panoorin Ngayon",
    status:"Inihahanda ang iyong content...",
    ready:"Handa na ang iyong content!",
    button:"Magpatuloy",
    note:"Sandali lang po"
  },
  bn:{
    title:"আপনার জন্য বিশেষ কিছু",
    subtitle:"আপনার কনটেন্ট প্রায় প্রস্তুত",
    caption:"এখনই দেখুন",
    status:"আপনার কনটেন্ট প্রস্তুত করা হচ্ছে...",
    ready:"আপনার কনটেন্ট প্রস্তুত!",
    button:"চালিয়ে যান",
    note:"অনুগ্রহ করে একটু অপেক্ষা করুন"
  },
  id:{
    title:"Sesuatu yang Spesial",
    subtitle:"Konten Anda hampir siap",
    caption:"Tonton Sekarang",
    status:"Menyiapkan konten Anda...",
    ready:"Konten Anda sudah siap!",
    button:"Lanjutkan",
    note:"Mohon tunggu sebentar"
  },
  ur:{
    title:"آپ کے لیے کچھ خاص",
    subtitle:"آپ کا مواد تقریباً تیار ہے",
    caption:"ابھی دیکھیں",
    status:"آپ کا مواد تیار کیا جا رہا ہے...",
    ready:"آپ کا مواد تیار ہے!",
    button:"جاری رکھیں",
    note:"براہ کرم تھوڑا انتظار کریں"
  },
  ar:{
    title:"شيء مميز لك",
    subtitle:"المحتوى الخاص بك جاهز تقريباً",
    caption:"شاهد الآن",
    status:"جارٍ تجهيز المحتوى...",
    ready:"المحتوى جاهز الآن!",
    button:"متابعة",
    note:"يرجى الانتظار قليلاً"
  }
};

const arabicCountries = [
"EG","SA","AE","KW","QA","BH","OM","JO","IQ",
"LB","SY","YE","PS","DZ","MA","TN","LY","SD",
"MR","SO","DJ","KM"
];

function languageFor(country){
  if(arabicCountries.includes(country)) return "ar";
  if(country==="KE") return "sw";
  if(country==="MZ") return "pt";
  if(country==="PH") return "fil";
  if(country==="BD") return "bn";
  if(country==="ID") return "id";
  if(country==="PK") return "ur";
  return "en";
}

function applyLanguage(lang){
  const t=translations[lang] || translations.en;
  document.documentElement.lang=lang;
  document.documentElement.dir=
    (lang==="ar" || lang==="ur") ? "rtl" : "ltr";

  document.getElementById("title").textContent=t.title;
  document.getElementById("subtitle").textContent=t.subtitle;
  document.getElementById("caption").textContent=t.caption;
  document.getElementById("status").textContent=t.status;
  document.getElementById("continueBtn").textContent=t.button;
  document.getElementById("note").textContent=t.note;
  return t;
}

async function start(){
  let lang="en";

  try{
    const response=await fetch("https://ipapi.co/json/");
    const data=await response.json();
    lang=languageFor(data.country_code || "");
  }catch(error){
    lang="en";
  }

  const t=applyLanguage(lang);

  document.getElementById("playLink").href=smartLink;
  document.getElementById("continueLink").href=smartLink;

  let seconds=3;
  const status=document.getElementById("status");
  const bar=document.getElementById("bar");
  const button=document.getElementById("continueBtn");

  const timer=setInterval(()=>{
    seconds--;
    bar.style.width=((3-seconds)/3*100)+"%";

    if(seconds<=0){
      clearInterval(timer);
      status.textContent=t.ready;
      button.disabled=false;
      bar.style.width="100%";
    }
  },1000);
}

start();

/* Freeze the GIF on its first decoded frame */
const previewImage=document.getElementById("previewImage");
previewImage.addEventListener("load",()=>{
  try{
    const canvas=document.createElement("canvas");
    canvas.width=previewImage.naturalWidth;
    canvas.height=previewImage.naturalHeight;
    const context=canvas.getContext("2d");
    context.drawImage(previewImage,0,0);
    previewImage.src=canvas.toDataURL("image/png");
  }catch(e){}
},{once:true});
</script>
</body>
</html>
