
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09060d">
<title>Something Special</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:22px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:'Cairo',sans-serif;
 color:white;
 background:
 radial-gradient(ellipse at 50% 0%,#51204e 0%,transparent 48%),
 radial-gradient(ellipse at 100% 100%,#35102f 0%,transparent 45%),
 #09060d;
}

.container{
 width:100%;
 max-width:420px;
 text-align:center;
}

.top-line{
 width:55px;
 height:4px;
 border-radius:10px;
 background:#e64c9d;
 margin:0 auto 22px;
 box-shadow:0 0 18px #e64c9d;
}

h1{
 font-size:28px;
 font-weight:800;
 margin:0 0 8px;
}

.subtitle{
 font-size:14px;
 color:#c7afc5;
 margin-bottom:25px;
}

.card{
 padding:15px;
 border-radius:25px;
 background:linear-gradient(145deg,#241327,#120d17);
 border:1px solid #63385f;
 box-shadow:0 15px 45px #0009,0 0 30px #9b287c25;
}

.preview{
 width:100%;
 aspect-ratio:1/1;
 position:relative;
 overflow:hidden;
 border-radius:18px;
 background:#160d19;
}

.preview img{
 width:100%;
 height:100%;
 object-fit:cover;
 filter:blur(30px) brightness(.28) saturate(.7);
 transform:scale(1.2);
}

.overlay{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:17px;
 background:linear-gradient(180deg,#170d1b22,#08050c88);
}

.play{
 width:82px;
 height:82px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#ec4ca0,#912b86);
 border:3px solid #ffffff55;
 box-shadow:0 0 35px #e63e9c88;
}

.play:after{
 content:"";
 width:0;
 height:0;
 border-top:15px solid transparent;
 border-bottom:15px solid transparent;
 border-left:22px solid white;
 margin-left:7px;
}

.caption{
 font-size:19px;
 font-weight:800;
 text-shadow:0 2px 10px black;
}

.status{
 color:#e6c8e2;
 font-size:14px;
 margin:22px 0 12px;
}

.progress{
 height:5px;
 width:100%;
 border-radius:20px;
 overflow:hidden;
 background:#39223a;
}

.bar{
 width:0;
 height:100%;
 background:linear-gradient(90deg,#8d35a5,#f04a9c);
 transition:width 1s linear;
}

.action{
 margin-top:20px;
}

button{
 width:100%;
 padding:16px;
 border:0;
 border-radius:15px;
 color:white;
 font-family:inherit;
 font-size:18px;
 font-weight:800;
 background:linear-gradient(110deg,#9c287e,#e44991);
 box-shadow:0 8px 25px #c22b8150;
 cursor:pointer;
}

button:disabled{
 opacity:.45;
 cursor:not-allowed;
}

.note{
 margin-top:17px;
 color:#9f899f;
 font-size:12px;
}

[dir="rtl"]{direction:rtl}
</style>
</head>

<body>

<div class="container">

 <div class="top-line"></div>

 <h1 id="title">Something Special</h1>
 <div class="subtitle" id="subtitle">Your content is almost ready</div>

 <div class="card">
  <a id="playLink" href="#" target="_blank" rel="noopener">
   <div class="preview">
    <img id="previewImage" src="./IMG_6092.gif" alt="Preview">
    <div class="overlay">
     <div class="play"></div>
     <div class="caption" id="caption">Watch Now</div>
    </div>
   </div>
  </a>

  <div class="status" id="status">Preparing your content...</div>

  <div class="progress">
   <div class="bar" id="bar"></div>
  </div>

  <div class="action">
   <a id="continueLink" href="#" target="_blank" rel="noopener">
    <button id="continueBtn" disabled>Continue</button>
   </a>
  </div>
 </div>

 <div class="note" id="note">Please wait a moment</div>

</div>

<script>

/* الرابط الأصلي من كودك بدون تغيير */
const smartLink =
"https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7";

const translations = {
 en:{
  title:"Something Special",
  subtitle:"Your content is almost ready",
  caption:"Watch Now",
  status:"Preparing your content...",
  ready:"Your content is ready!",
  button:"Continue",
  note:"Please wait a moment"
 },
 sw:{
  title:"Kitu Maalum",
  subtitle:"Maudhui yako yanakaribia kuwa tayari",
  caption:"Tazama Sasa",
  status:"Tunatayarisha maudhui yako...",
  ready:"Maudhui yako yako tayari!",
  button:"Endelea",
  note:"Tafadhali subiri kidogo"
 },
 pt:{
  title:"Algo Especial",
  subtitle:"O seu conteúdo está quase pronto",
  caption:"Assistir Agora",
  status:"A preparar o seu conteúdo...",
  ready:"O seu conteúdo está pronto!",
  button:"Continuar",
  note:"Por favor, aguarde um momento"
 },
 fil:{
  title:"May Espesyal Para Sa Iyo",
  subtitle:"Halos handa na ang iyong content",
  caption:"Panoorin Ngayon",
  status:"Inihahanda ang iyong content...",
  ready:"Handa na ang iyong content!",
  button:"Magpatuloy",
  note:"Sandali lang po"
 },
 bn:{
  title:"আপনার জন্য বিশেষ কিছু",
  subtitle:"আপনার কনটেন্ট প্রায় প্রস্তুত",
  caption:"এখনই দেখুন",
  status:"আপনার কনটেন্ট প্রস্তুত করা হচ্ছে...",
  ready:"আপনার কনটেন্ট প্রস্তুত!",
  button:"চালিয়ে যান",
  note:"অনুগ্রহ করে একটু অপেক্ষা করুন"
 },
 id:{
  title:"Sesuatu yang Spesial",
  subtitle:"Konten Anda hampir siap",
  caption:"Tonton Sekarang",
  status:"Menyiapkan konten Anda...",
  ready:"Konten Anda sudah siap!",
  button:"Lanjutkan",
  note:"Mohon tunggu sebentar"
 },
 ur:{
  title:"آپ کے لیے کچھ خاص",
  subtitle:"آپ کا مواد تقریباً تیار ہے",
  caption:"ابھی دیکھیں",
  status:"آپ کا مواد تیار کیا جا رہا ہے...",
  ready:"آپ کا مواد تیار ہے!",
  button:"جاری رکھیں",
  note:"براہ کرم تھوڑا انتظار کریں"
 },
 ar:{
  title:"شيء مميز لك",
  subtitle:"المحتوى الخاص بك جاهز تقريباً",
  caption:"شاهد الآن",
  status:"جارٍ تجهيز المحتوى...",
  ready:"المحتوى جاهز الآن!",
  button:"متابعة",
  note:"يرجى الانتظار قليلاً"
 }
};

const arabicCountries=[
 "EG","SA","AE","KW","QA","BH","OM","JO","IQ",
 "LB","SY","YE","PS","DZ","MA","TN","LY","SD",
 "MR","SO","DJ","KM"
];

function languageFor(country){
 if(arabicCountries.includes(country)) return "ar";
 if(country==="KE") return "sw";
 if(country==="MZ") return "pt";
 if(country==="PH") return "fil";
 if(country==="BD") return "bn";
 if(country==="ID") return "id";
 if(country==="PK") return "ur";
 return "en";
}

function applyLanguage(lang){
 const t=translations[lang]||translations.en;

 document.documentElement.lang=lang;
 document.documentElement.dir=
  (lang==="ar"||lang==="ur")?"rtl":"ltr";

 document.getElementById("title").textContent=t.title;
 document.getElementById("subtitle").textContent=t.subtitle;
 document.getElementById("caption").textContent=t.caption;
 document.getElementById("status").textContent=t.status;
 document.getElementById("continueBtn").textContent=t.button;
 document.getElementById("note").textContent=t.note;

 return t;
}

async function start(){

 let lang="en";

 try{
  const response=await fetch("https://ipapi.co/json/");
  const data=await response.json();
  lang=languageFor(data.country_code||"");
 }catch(e){}

 const t=applyLanguage(lang);

 document.getElementById("playLink").href=smartLink;
 document.getElementById("continueLink").href=smartLink;

 let seconds=3;

 const status=document.getElementById("status");
 const bar=document.getElementById("bar");
 const button=document.getElementById("continueBtn");

 const timer=setInterval(()=>{
  seconds--;
  bar.style.width=((3-seconds)/3*100)+"%";

  if(seconds<=0){
   clearInterval(timer);
   status.textContent=t.ready;
   button.disabled=false;
   bar.style.width="100%";
  }
 },1000);
}

start();

/* محاولة تثبيت أول فريم من الصورة */
const img=document.getElementById("previewImage");

img.addEventListener("load",function(){
 try{
  const canvas=document.createElement("canvas");
  canvas.width=img.naturalWidth;
  canvas.height=img.naturalHeight;
  canvas.getContext("2d").drawImage(img,0,0);
  img.src=canvas.toDataURL("image/png");
 }catch(e){}
},{once:true});

</script>
</body>
</html>
